<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HostelCare</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font:15px Inter,Arial;background:#f4f7fb;color:#172033}#app{min-height:100vh;background:radial-gradient(circle at top right,#dbeafe,transparent 35%),#f4f7fb}.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:20px;padding:28px;box-shadow:0 14px 40px #18243a16}.auth .card{width:min(460px,100%)}h1{margin:0 0 8px;font-size:28px}h2{margin:0 0 8px}.muted{color:#667085}input,select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;margin:6px 0 12px;font:inherit}button{border:0;border-radius:10px;padding:11px 15px;background:#2563eb;color:white;font-weight:700;cursor:pointer}button.alt{background:#e8eef9;color:#234}button:disabled{opacity:.6}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{padding:28px 18px;background:#101828;color:white}.brand{font-size:22px;font-weight:800;margin-bottom:30px}.side p{color:#a9b8cf}.main{padding:32px;max-width:1100px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat{padding:18px}.stat b{display:block;font-size:26px;margin-top:6px}.wide{grid-column:span 2}.notice{padding:11px;border-radius:10px;background:#eff8ff;color:#175cd3;margin:12px 0}.error{background:#fee4e2;color:#b42318}.member{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid #edf0f4}.link{word-break:break-all;background:#f6f8fc;padding:10px;border-radius:8px}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:18px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div id="app"></div><script>const S=window.supabase.createClient('https://tpoagszamkbtddbhaeoc.supabase.co','sb_publishable_I4tJAg-S4lLd9y86xpx9GQ_kAbtYd-_'),A=document.getElementById('app'),token=new URLSearchParams(location.search).get('invite');const esc=v=>String(v||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function auth(){A.innerHTML='<div class="auth"><div class="card"><h1>🏠 HostelCare</h1><p class="muted">'+(token?'Join your hostel group':'Secure hostel management')+'</p><div id="n"></div><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password (minimum 6 characters)"><button id="in">Sign in</button> <button class="alt" id="resident">Create resident account</button><hr><h2>New warden</h2><input id="name" placeholder="Full name"><input id="phone" placeholder="Phone number"><button id="warden">Create warden account</button></div></div>';const say=(x,e)=>n.innerHTML='<div class="notice '+(e?'error':'')+'">'+esc(x)+'</div>';in.onclick=async()=>{let r=await S.auth.signInWithPassword({email:email.value,password:pass.value});if(r.error)say(r.error.message,1);else load()};resident.onclick=async()=>{let r=await S.auth.signUp({email:email.value,password:pass.value});say(r.error?r.error.message:(r.data.session?'Account created.':'Confirm your email, then sign in.'),!!r.error);if(r.data.session)load()};warden.onclick=async()=>{if(!name.value||!phone.value)return say('Enter name and phone number.',1);let r=await S.auth.signUp({email:email.value,password:pass.value});if(r.error)return say(r.error.message,1);if(!r.data.session)return say('Confirm your email, then sign in.');let q=await S.rpc('complete_warden_onboarding',{p_full_name:name.value,p_phone:phone.value});if(q.error)say(q.error.message,1);else load()}}async function load(){let u=(await S.auth.getUser()).data.user;if(!u)return auth();if(token){let j=await S.rpc('join_group_with_invite',{p_token:token});history.replaceState({},'',location.pathname);if(j.error)alert(j.error.message)}let p=(await S.from('profiles').select('*').eq('id',u.id).maybeSingle()).data;if(!p)return auth();let gs=(await S.from('hostel_groups').select('*').order('created_at')).data||[];let g=gs[0],members=g?(await S.from('group_members').select('*').eq('group_id',g.id)).data||[]:[];A.innerHTML='<div class="shell"><aside class="side"><div class="brand">🏠 HostelCare</div><p>Hostel group management</p><p>Signed in as<br><b>'+esc(u.email)+'</b></p><button class="alt" id="out">Sign out</button></aside><main class="main"><div class="top"><div><h1>Welcome, '+esc(p.full_name||'Resident')+'</h1><p class="muted">'+esc(p.account_type)+' account</p></div></div><div id="note"></div>'+(p.account_type==='warden'&&!g?'<section class="card"><h2>Create your hostel group</h2><p class="muted">Only wardens can create and manage groups.</p><input id="gn" placeholder="Hostel/group name"><input id="cap" type="number" value="100" min="1"><button id="create">Create group</button></section>':g?'<div class="grid"><section class="card stat"><span class="muted">Group</span><b>'+esc(g.name)+'</b></section><section class="card stat"><span class="muted">Residents</span><b>'+members.length+' / '+g.capacity+'</b></section><section class="card stat"><span class="muted">Your role</span><b>'+esc(members.find(x=>x.user_id===u.id)?.role||'resident')+'</b></section><section class="card wide"><div class="top"><h2>Members</h2>'+((p.account_type==='warden')?'<button id="invite">Create invite</button>':'')+'</div><div id="invitebox"></div>'+members.map(x=>'<div class="member"><span>'+esc(x.user_id.slice(0,12))+'…</span><span>'+esc(x.role)+'</span></div>').join('')+'</section></div>':'<section class="card"><h2>No group yet</h2><p class="muted">Ask a warden for an invitation link.</p></section>')+'</main></div>';out.onclick=async()=>{await S.auth.signOut();auth()};if(create)create.onclick=async()=>{let r=await S.rpc('create_hostel_group',{p_name:gn.value,p_capacity:+cap.value});if(r.error)note.innerHTML='<div class="notice error">'+esc(r.error.message)+'</div>';else load()};if(invite)invite.onclick=async()=>{let r=await S.rpc('create_group_invite',{p_group_id:g.id,p_max_uses:100});invitebox.innerHTML=r.error?'<div class="notice error">'+esc(r.error.message)+'</div>':'<p class="link">'+location.origin+location.pathname+'?invite='+r.data.token+'</p>'}}load();S.auth.onAuthStateChange(()=>setTimeout(load,0));</script></body></html>
